apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    {{- include "colis.etiquettes" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
  - name: postgres
    port: 5432
    targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    {{- include "colis.etiquettes" . | nindent 4 }}
    app.kubernetes.io/name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "colis.etiquettes" . | nindent 8 }}
        app.kubernetes.io/name: postgres
    spec:
      containers:
      - name: postgres
        image: {{ .Values.images.postgres }}
        env:
        - name: POSTGRES_USER
          value: colis
        - name: POSTGRES_DB
          value: colis
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: colis-db
              key: POSTGRES_PASSWORD
        ports:
        - name: postgres
          containerPort: 5432
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "colis", "-d", "colis"]
          periodSeconds: 5
        resources:
          {{- toYaml .Values.postgres.ressources | nindent 10 }}
        volumeMounts:
        - name: donnees
          mountPath: /var/lib/postgresql
  volumeClaimTemplates:
  - metadata:
      name: donnees
    spec:
      accessModes: [ReadWriteOnce]
      {{- with .Values.postgres.classe }}
      storageClassName: {{ . }}
      {{- end }}
      resources:
        requests:
          storage: {{ .Values.postgres.stockage }}
