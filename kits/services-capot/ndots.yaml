# Un client dont le résolveur n'essaie les domaines de recherche que pour les noms sans point.
apiVersion: v1
kind: Pod
metadata:
  name: client-ndots1
spec:
  dnsConfig:
    options:
    - {name: ndots, value: "1"}
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - {key: node-role.kubernetes.io/control-plane, operator: DoesNotExist}
  containers:
  - name: c
    image: nicolaka/netshoot:v0.14
    command: [sleep, infinity]
