apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: lecture-colis
rules:
- apiGroups: [""]
  resources: [pods, pods/log, services, configmaps, events]
  verbs: [get, list, watch]
- apiGroups: [apps]
  resources: [deployments, statefulsets, replicasets]
  verbs: [get, list, watch]
