# Un Pod avec un volume emptyDir, partagé par ses deux conteneurs.
apiVersion: v1
kind: Pod
metadata:
  name: brouillon
spec:
  terminationGracePeriodSeconds: 2   # busybox en PID 1 ignore SIGTERM (chapitre 22)
  containers:
  - name: ecrivain
    image: busybox:1.37
    command: ["sh", "-c", "while [ ! -f /brouillon/stop ]; do date -u +%T >> /brouillon/journal.txt; sleep 5; done; rm /brouillon/stop; exit 1"]
    volumeMounts:
    - name: brouillon
      mountPath: /brouillon
  - name: lecteur
    image: busybox:1.37
    command: ["sh", "-c", "sleep 3600"]
    volumeMounts:
    - name: brouillon
      mountPath: /lecture
      readOnly: true
  volumes:
  - name: brouillon
    emptyDir:
      sizeLimit: 50Mi
