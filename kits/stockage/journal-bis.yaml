# Un second Pod qui monte la même demande « journal » (ReadWriteOnce), sur le même nœud.
apiVersion: v1
kind: Pod
metadata:
  name: journal-bis
spec:
  terminationGracePeriodSeconds: 2   # busybox en PID 1 ignore SIGTERM (chapitre 22)
  containers:
  - name: journal
    image: busybox:1.37
    command: ["sh", "-c", "echo \"$(date -u +%T) ligne du second Pod\" >> /journal/journal.txt; sleep 3600"]
    volumeMounts:
    - name: journal
      mountPath: /journal
  volumes:
  - name: journal
    persistentVolumeClaim:
      claimName: journal
