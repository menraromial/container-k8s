# Un volume hostPath qui monte la racine du nœud : à ne jamais faire hors d'un laboratoire.
apiVersion: v1
kind: Pod
metadata:
  name: hote
spec:
  terminationGracePeriodSeconds: 2   # busybox en PID 1 ignore SIGTERM (chapitre 22)
  containers:
  - name: curieux
    image: busybox:1.37
    command: ["sh", "-c", "sleep 3600"]
    volumeMounts:
    - name: racine
      mountPath: /hote
  volumes:
  - name: racine
    hostPath:
      path: /
      type: Directory
