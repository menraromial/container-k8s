# Un volume neuf, rempli avec le contenu de l'instantané journal-1, et un Pod pour le lire.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: journal-restaure
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 200Mi   # au moins la taille de l'instantané (RESTORESIZE)
  storageClassName: csi-attente
  dataSource:
    apiGroup: snapshot.storage.k8s.io
    kind: VolumeSnapshot
    name: journal-1
---
apiVersion: v1
kind: Pod
metadata:
  name: lecteur-restaure
spec:
  terminationGracePeriodSeconds: 2   # busybox en PID 1 ignore SIGTERM (chapitre 22)
  containers:
  - name: lecteur
    image: busybox:1.37
    command: ["sh", "-c", "cat /journal/journal.txt; sleep 3600"]
    volumeMounts:
    - name: journal
      mountPath: /journal
  volumes:
  - name: journal
    persistentVolumeClaim:
      claimName: journal-restaure
