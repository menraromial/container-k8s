# Un stockage objet compatible S3 dans le cluster (RustFS, déjà utilisé au chapitre 52),
# pour les sauvegardes continues de PostgreSQL. Ailleurs, ce serait un compartiment S3 ou GCS.
apiVersion: v1
kind: Secret
metadata:
  name: rustfs
  namespace: stockage
stringData:
  RUSTFS_ACCESS_KEY: cnpg
  RUSTFS_SECRET_KEY: sauvegardes-du-cours-56
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rustfs
  namespace: stockage
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustfs
  namespace: stockage
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: rustfs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rustfs
    spec:
      containers:
      - name: rustfs
        image: rustfs/rustfs:1.0.1
        envFrom:
        - secretRef:
            name: rustfs
        env:
        - name: RUSTFS_VOLUMES
          value: /data
        - name: RUSTFS_ADDRESS
          value: ":9000"
        - name: RUSTFS_CONSOLE_ENABLE
          value: "true"
        ports:
        - name: s3
          containerPort: 9000
        - name: console
          containerPort: 9001
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {memory: 512Mi}
        volumeMounts:
        - name: donnees
          mountPath: /data
      volumes:
      - name: donnees
        persistentVolumeClaim:
          claimName: rustfs
---
apiVersion: v1
kind: Service
metadata:
  name: rustfs
  namespace: stockage
spec:
  selector:
    app.kubernetes.io/name: rustfs
  ports:
  - name: s3
    port: 9000
    targetPort: s3
  - name: console
    port: 9001
    targetPort: console
