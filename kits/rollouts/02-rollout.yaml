# Un Rollout à la place d'un Deployment : même gabarit de Pod, et une stratégie canari par étapes.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: vitrine
  namespace: ch58
spec:
  replicas: 4
  selector:
    matchLabels: {app: vitrine}
  template:
    metadata:
      labels: {app: vitrine}
    spec:
      containers:
      - name: podinfo
        image: ghcr.io/stefanprodan/podinfo:6.14.1
        ports:
        - {name: http, containerPort: 9898}
        readinessProbe:
          httpGet: {path: /readyz, port: http}
          periodSeconds: 2
        resources:
          requests: {cpu: 10m, memory: 16Mi}
          limits: {memory: 64Mi}
  strategy:
    canary:
      stableService: vitrine-stable
      canaryService: vitrine-canari
      trafficRouting:
        plugins:
          argoproj-labs/gatewayAPI:
            httpRoute: vitrine
            namespace: ch58
      steps:
      - setWeight: 10
      - pause: {duration: 30s}
      - setWeight: 50
      - pause: {}              # attente sans limite : il faut promouvoir à la main
      - setWeight: 100
