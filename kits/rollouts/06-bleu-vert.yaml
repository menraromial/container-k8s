# Bleu-vert : deux versions complètes en parallèle. Le Service actif sert les utilisateurs,
# le Service de prévisualisation la nouvelle version ; la promotion bascule tout d'un coup.
apiVersion: v1
kind: Service
metadata:
  name: bv-actif
  namespace: ch58
spec:
  selector: {app: bv}
  ports:
  - {name: http, port: 80, targetPort: http}
---
apiVersion: v1
kind: Service
metadata:
  name: bv-apercu
  namespace: ch58
spec:
  selector: {app: bv}
  ports:
  - {name: http, port: 80, targetPort: http}
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: bv
  namespace: ch58
spec:
  replicas: 2
  selector:
    matchLabels: {app: bv}
  template:
    metadata:
      labels: {app: bv}
    spec:
      containers:
      - name: podinfo
        image: ghcr.io/stefanprodan/podinfo:6.14.1
        ports:
        - {name: http, containerPort: 9898}
        readinessProbe:
          httpGet: {path: /readyz, port: http}
          periodSeconds: 2
        resources:
          requests: {cpu: 10m, memory: 16Mi}
          limits: {memory: 64Mi}
  strategy:
    blueGreen:
      activeService: bv-actif
      previewService: bv-apercu
      autoPromotionEnabled: false       # la bascule attend une promotion
      scaleDownDelaySeconds: 30         # l'ancienne version reste 30 s, de quoi revenir en arrière
