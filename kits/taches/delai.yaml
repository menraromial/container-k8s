# Un Job qui dure trop longtemps : activeDeadlineSeconds l'arrête au bout de 10 secondes.
# ttlSecondsAfterFinished le fait supprimer 30 secondes après sa fin.
apiVersion: batch/v1
kind: Job
metadata:
  name: delai
spec:
  activeDeadlineSeconds: 10
  ttlSecondsAfterFinished: 30
  template:
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 2
      containers:
      - name: lent
        image: busybox:1.37
        command: ["sh", "-c", "sleep 60"]
