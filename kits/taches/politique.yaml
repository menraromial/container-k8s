# Une politique d'échec : le code 42 veut dire « erreur de configuration, inutile de réessayer ».
apiVersion: batch/v1
kind: Job
metadata:
  name: politique
spec:
  backoffLimit: 6
  podFailurePolicy:
    rules:
    - action: FailJob
      onExitCodes:
        containerName: tache
        operator: In
        values: [42]
    - action: Ignore
      onPodConditions:
      - type: DisruptionTarget
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: tache
        image: busybox:1.37
        command: ["sh", "-c", "echo 'variable COLIS_DB absente'; exit 42"]
