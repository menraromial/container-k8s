apiVersion: v1
kind: Pod
metadata:
  name: duo
spec:
  volumes:
  - name: journaux
    emptyDir: {}
  containers:
  - name: web
    image: nginx:1.30-alpine
    volumeMounts:
    - name: journaux
      mountPath: /var/log/nginx
  - name: compteur
    image: busybox:1.37
    command: ["sh", "-c", "while true; do wget -q -O /dev/null http://localhost/; echo \"$(date +%T) requêtes servies : $(grep -c GET /journaux/access.log)\"; sleep 5; done"]
    volumeMounts:
    - name: journaux
      mountPath: /journaux
