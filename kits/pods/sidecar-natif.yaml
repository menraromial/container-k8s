apiVersion: v1
kind: Pod
metadata:
  name: sidecar-natif
spec:
  restartPolicy: Never
  volumes:
  - name: partage
    emptyDir: {}
  initContainers:
  - name: expediteur
    image: busybox:1.37
    restartPolicy: Always
    command: ["sh", "-c", "touch /partage/sortie.log; tail -f /partage/sortie.log"]
    volumeMounts:
    - name: partage
      mountPath: /partage
  containers:
  - name: tache
    image: busybox:1.37
    command: ["sh", "-c", "for i in 1 2 3; do echo \"ligne $i\" >> /partage/sortie.log; sleep 2; done"]
    volumeMounts:
    - name: partage
      mountPath: /partage
