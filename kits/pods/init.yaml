apiVersion: v1
kind: Pod
metadata:
  name: init
spec:
  volumes:
  - name: site
    emptyDir: {}
  initContainers:
  - name: preparer
    image: busybox:1.37
    command: ["sh", "-c", "sleep 8; echo \"<h1>Préparé par l'init container à $(date +%T)</h1>\" > /site/index.html"]
    volumeMounts:
    - name: site
      mountPath: /site
  containers:
  - name: web
    image: nginx:1.30-alpine
    volumeMounts:
    - name: site
      mountPath: /usr/share/nginx/html
