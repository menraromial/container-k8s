# Ce que fournit l'équipe plateforme : une classe de passerelle (l'implémentation, Envoy Gateway)
# et une passerelle partagée, dans son propre namespace, ouverte aux namespaces qui portent l'étiquette
# passerelle=principale.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: v1
kind: Namespace
metadata:
  name: passerelle
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: principale
  namespace: passerelle
spec:
  gatewayClassName: envoy
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: Selector
        selector:
          matchLabels:
            passerelle: principale
