# Une autorité de certification locale, gérée par cert-manager :
# un émetteur autosigné crée le certificat racine, puis un émetteur « ca » signe avec cette racine.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: autosigne
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: colis-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: Autorite de certification du cours
  secretName: colis-ca
  duration: 87600h          # dix ans
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: autosigne
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: colis-ca
spec:
  ca:
    secretName: colis-ca    # lu dans le namespace de cert-manager
