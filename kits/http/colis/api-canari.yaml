# Une seconde version de l'API, qui recevra une petite part du trafic (chapitre 28).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-canari
  namespace: colis
  labels:
    app.kubernetes.io/name: api-canari
    app.kubernetes.io/part-of: colis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api-canari
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-canari
        app.kubernetes.io/part-of: colis
    spec:
      containers:
      - name: api
        image: host.minikube.internal:5001/colis/api:2.1
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: colis-config
        env:
        - name: COLIS_VERSION          # remplace la valeur de la ConfigMap
          value: 2.1.0-canari
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: colis-db
              key: POSTGRES_PASSWORD
        - name: COLIS_DB
          value: postgresql://colis:$(POSTGRES_PASSWORD)@postgres:5432/colis
        ports:
        - name: http
          containerPort: 8000
        startupProbe:
          httpGet:
            path: /sante
            port: http
          periodSeconds: 2
          failureThreshold: 15
        livenessProbe:
          httpGet:
            path: /sante
            port: http
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /pret
            port: http
          periodSeconds: 5
        lifecycle:
          preStop:
            sleep:
              seconds: 3
        resources:
          requests:
            cpu: 100m
            memory: 192Mi
          limits:
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api-canari
  namespace: colis
  labels:
    app.kubernetes.io/part-of: colis
spec:
  selector:
    app.kubernetes.io/name: api-canari
  ports:
  - name: http
    port: 8000
    targetPort: http
