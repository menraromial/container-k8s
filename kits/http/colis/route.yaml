# Ce qu'écrit l'équipe de Colis : les règles de routage de son site, attachées à la passerelle partagée.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: colis
  namespace: colis
spec:
  parentRefs:
  - name: principale
    namespace: passerelle
  hostnames:
  - colis.local
  rules:
  - matches:                 # /api/... va directement à l'API, sans le préfixe
    - path:
        type: PathPrefix
        value: /api
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /
    backendRefs:
    - name: api
      port: 8000
  - matches:                 # tout le reste va au site
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: web
      port: 80
