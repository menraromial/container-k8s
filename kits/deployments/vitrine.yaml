apiVersion: apps/v1
kind: Deployment
metadata:
  name: vitrine
  labels:
    app.kubernetes.io/name: vitrine
spec:
  replicas: 4
  minReadySeconds: 5
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: vitrine
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vitrine
    spec:
      containers:
      - name: nginx
        image: nginx:1.29-alpine
