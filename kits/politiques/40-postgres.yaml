# PostgreSQL : seuls l'API, le worker et la purge y ont accès.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
  namespace: colis
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: postgres}
  policyTypes: [Ingress]
  ingress:
  - from:
    - podSelector:
        matchExpressions:
        - {key: app.kubernetes.io/name, operator: In, values: [api, api-canari, worker, purge]}
    ports:
    - {port: postgres}
