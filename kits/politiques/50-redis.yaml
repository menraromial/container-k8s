# Redis : l'API y dépose le travail, le worker le prend, et l'opérateur de KEDA mesure la file (namespace keda).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis
  namespace: colis
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: redis}
  policyTypes: [Ingress]
  ingress:
  - from:
    - podSelector:
        matchExpressions:
        - {key: app.kubernetes.io/name, operator: In, values: [api, api-canari, worker]}
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: keda}
      podSelector:
        matchLabels: {app.kubernetes.io/name: keda-operator}
    ports:
    - {port: redis}
