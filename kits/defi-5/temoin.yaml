# Le Deployment à suivre, et un Service pour qu'il ait une EndpointSlice.
apiVersion: v1
kind: Namespace
metadata:
  name: defi5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temoin
  namespace: defi5
spec:
  replicas: 2
  selector:
    matchLabels: {app: temoin}
  template:
    metadata:
      labels: {app: temoin}
    spec:
      containers:
      - name: web
        image: registry.k8s.io/e2e-test-images/agnhost:2.61
        args: [netexec, --http-port=8080]
        ports:
        - {name: http, containerPort: 8080}
---
apiVersion: v1
kind: Service
metadata:
  name: temoin
  namespace: defi5
spec:
  selector: {app: temoin}
  ports:
  - {name: http, port: 80, targetPort: http}
