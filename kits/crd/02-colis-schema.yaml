# Le type Colis avec un schéma : types, bornes, motifs, valeurs par défaut.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: colis.cours.example.com
spec:
  group: cours.example.com
  scope: Namespaced
  names:
    kind: Colis
    singular: colis
    plural: colis
    listKind: ColisList
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        description: Une installation de l'application Colis.
        required: [spec]
        properties:
          spec:
            type: object
            required: [version]
            properties:
              version:
                type: string
                description: Version de l'image de l'API et du worker.
                pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
              api:
                type: object
                default: {}
                properties:
                  replicas:
                    type: integer
                    minimum: 1
                    maximum: 10
                    default: 2
              worker:
                type: object
                default: {}
                properties:
                  min:
                    type: integer
                    minimum: 0
                    default: 0
                  max:
                    type: integer
                    minimum: 1
                    maximum: 20
                    default: 5
              base:
                type: object
                default: {}
                properties:
                  taille:
                    type: string
                    default: 1Gi
                    pattern: '^[0-9]+(Mi|Gi)$'
                  classe:
                    type: string
                    enum: [standard, csi-hostpath-sc]
                    default: standard
