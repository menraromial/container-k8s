# Exercice 1 : trois répliques, une par zone, et jamais deux sur le même nœud si on en ajoute.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-repartie
spec:
  replicas: 3
  selector:
    matchLabels: {app: api-repartie}
  template:
    metadata:
      labels: {app: api-repartie}
    spec:
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels: {app: api-repartie}
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels: {app: api-repartie}
      containers:
      - name: pause
        image: registry.k8s.io/pause:3.10
