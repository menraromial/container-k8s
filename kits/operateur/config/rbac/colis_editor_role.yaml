# This rule is not used by the project colis-operateur itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the cours.example.com.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: colis-operateur
    app.kubernetes.io/managed-by: kustomize
  name: colis-editor-role
rules:
- apiGroups:
  - cours.example.com
  resources:
  - colis
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - cours.example.com
  resources:
  - colis/status
  verbs:
  - get
