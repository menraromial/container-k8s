# Une deuxième application, petite : les limites du namespace de préproduction.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: quotas-staging
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io    # supprimer l'application supprime ses objets
spec:
  project: default
  source:
    repoURL: http://gitea.git.svc.cluster.local:3000/cours/colis-config.git
    targetRevision: main
    path: quotas/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: colis-staging
  syncPolicy:
    automated: {prune: true, selfHeal: true}
