# La route de Colis sur la passerelle du chapitre 28. Le nom d'hôte est fixé par chaque overlay.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: colis
spec:
  parentRefs:
  - name: principale
    namespace: passerelle
    sectionName: http
  hostnames:
  - colis.local
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /api
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /
    backendRefs:
    - name: api
      port: 8000
  - backendRefs:
    - name: web
      port: 80
