# Un Pod épinglé sur le nœud de travail, avec des requests et des limits, pour le suivre jusqu'au processus.
apiVersion: v1
kind: Pod
metadata:
  name: suivi
spec:
  nodeSelector: {kubernetes.io/hostname: deux-noeuds-m02}
  containers:
  - name: web
    image: registry.k8s.io/e2e-test-images/agnhost:2.61
    args: [netexec, --http-port=8080]
    resources:
      requests: {cpu: 100m, memory: 32Mi}
      limits: {cpu: 200m, memory: 64Mi}
