# Purge lancée à la main, une fois. Le chapitre 27 en fera un CronJob.
apiVersion: v1
kind: Pod
metadata:
  name: purge
  namespace: colis
  labels:
    app.kubernetes.io/name: purge
    app.kubernetes.io/part-of: colis
spec:
  restartPolicy: Never
  containers:
  - name: purge
    image: colis:2.0
    imagePullPolicy: IfNotPresent
    command: ["python", "-m", "colis.purge"]
    envFrom:
    - configMapRef:
        name: colis-config
    env:
    - name: POSTGRES_PASSWORD
      valueFrom:
        secretKeyRef:
          name: colis-db
          key: POSTGRES_PASSWORD
    - name: COLIS_DB
      value: postgresql://colis:$(POSTGRES_PASSWORD)@postgres:5432/colis
