apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: colis-defi
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: colis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: colis
    spec:
      containers:
      - name: redis
        image: redis:8.8-alpine
        ports:
        - name: redis
          containerPort: 6379
        readinessProbe:
          exec:
            command: ["redis-cli", "ping"]
          periodSeconds: 5
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: colis-defi
  labels:
    app.kubernetes.io/part-of: colis
spec:
  selector:
    app.kubernetes.io/name: redis
  ports:
  - name: redis
    port: 6379
    targetPort: redis
