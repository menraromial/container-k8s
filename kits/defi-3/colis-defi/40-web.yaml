apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: colis-defi
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: colis
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        app.kubernetes.io/part-of: colis
    spec:
      containers:
      - name: web
        image: host.minikube.internal:5001/colis/web:1.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 80
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          periodSeconds: 5
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: colis-defi
  labels:
    app.kubernetes.io/part-of: colis
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: web
  ports:
  - name: http
    port: 80
    targetPort: http
