<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Colis</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Colis</h1>
    <p id="etat">…</p>
  </header>
  <main>
    <section>
      <h2>Enregistrer un envoi</h2>
      <form id="formulaire">
        <label>Destinataire <input name="destinataire" required maxlength="120"></label>
        <label>Départ <select name="depart" required></select></label>
        <label>Arrivée <select name="arrivee" required></select></label>
        <label>Poids (kg) <input name="poids_kg" type="number" min="0.1" max="70" step="0.1" value="1" required></label>
        <button type="submit">Enregistrer</button>
      </form>
      <p id="message" role="status"></p>
    </section>
    <section>
      <h2>Derniers colis</h2>
      <table>
        <thead><tr><th>N°</th><th>Destinataire</th><th>Trajet</th><th>Poids</th><th>Statut</th><th>Livraison estimée</th></tr></thead>
        <tbody id="liste"></tbody>
      </table>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
