apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    {{- include "colis.etiquettes" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
  - name: redis
    port: 6379
    targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    {{- include "colis.etiquettes" . | nindent 4 }}
    app.kubernetes.io/name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "colis.etiquettes" . | nindent 8 }}
        app.kubernetes.io/name: redis
    spec:
      containers:
      - name: redis
        image: {{ .Values.images.redis }}
        ports:
        - name: redis
          containerPort: 6379
        readinessProbe:
          exec:
            command: ["redis-cli", "ping"]
          periodSeconds: 5
        resources:
          {{- toYaml .Values.redis.ressources | nindent 10 }}
