{{- /*
Le mot de passe de PostgreSQL : tiré au hasard à l'installation, puis relu dans le cluster
à chaque mise à jour (lookup), car PostgreSQL ne le lit qu'à la création de sa base.
Le Secret est gardé à la désinstallation, comme le volume de la base (resource-policy: keep).
*/ -}}
{{- $existant := lookup "v1" "Secret" .Release.Namespace "colis-db" }}
apiVersion: v1
kind: Secret
metadata:
  name: colis-db
  labels:
    {{- include "colis.etiquettes" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if $existant }}
  POSTGRES_PASSWORD: {{ index $existant.data "POSTGRES_PASSWORD" }}
  {{- else }}
  POSTGRES_PASSWORD: {{ randAlphaNum 24 | b64enc }}
  {{- end }}
