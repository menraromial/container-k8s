apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    {{- include "colis.etiquettes" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: api
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
  - name: http
    port: 8000
    targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    {{- include "colis.etiquettes" . | nindent 4 }}
    app.kubernetes.io/name: api
spec:
  replicas: {{ .Values.api.repliques }}
  selector:
    matchLabels:
      app.kubernetes.io/name: api
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "colis.etiquettes" . | nindent 8 }}
        app.kubernetes.io/name: api
      annotations:
        # change quand la ConfigMap change : les Pods sont alors remplacés (chapitre 21)
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
    spec:
      containers:
      - name: api
        image: {{ include "colis.imageApi" . }}
        {{- include "colis.env" . | nindent 8 }}
        ports:
        - name: http
          containerPort: 8000
        startupProbe:
          httpGet: {path: /sante, port: http}
          periodSeconds: 2
          failureThreshold: 15
        livenessProbe:
          httpGet: {path: /sante, port: http}
          periodSeconds: 10
        readinessProbe:
          httpGet: {path: /pret, port: http}
          periodSeconds: 5
        lifecycle:
          preStop:
            sleep:
              seconds: 3
        resources:
          {{- toYaml .Values.api.ressources | nindent 10 }}
