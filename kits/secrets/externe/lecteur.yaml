# Un Pod qui lit le même Secret de deux façons : variable d'environnement et fichier monté.
apiVersion: v1
kind: Pod
metadata:
  name: lecteur
  namespace: colis
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile: {type: RuntimeDefault}
  containers:
  - name: lecteur
    image: busybox:1.37
    command: [sleep, "3600"]
    env:
    - name: JETON_PARTENAIRE
      valueFrom:
        secretKeyRef: {name: colis-partenaire, key: JETON_PARTENAIRE}
    resources:
      limits: {memory: 16Mi}
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities: {drop: [ALL]}
    volumeMounts:
    - {name: partenaire, mountPath: /secrets, readOnly: true}
  volumes:
  - name: partenaire
    secret: {secretName: colis-partenaire}
