# Le compte avec lequel External Secrets s'authentifie auprès de Vault pour le namespace colis.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-colis
  namespace: colis
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault
  namespace: colis
spec:
  provider:
    vault:
      server: http://vault.coffre.svc:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: colis-eso
          serviceAccountRef:
            name: eso-colis
            audiences: [vault]
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: colis-partenaire
  namespace: colis
spec:
  refreshInterval: 30s
  secretStoreRef:
    kind: SecretStore
    name: vault
  target:
    name: colis-partenaire
  data:
  - secretKey: JETON_PARTENAIRE
    remoteRef:
      key: colis/api
      property: jeton-partenaire
