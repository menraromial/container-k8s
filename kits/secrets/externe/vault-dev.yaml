# Vault en mode développement : stockage en mémoire, déverrouillé, jeton racine connu.
# Pour le cours seulement ; un vrai coffre se déploie en haute disponibilité, avec stockage chiffré.
apiVersion: v1
kind: Namespace
metadata:
  name: coffre
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.37
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault
  namespace: coffre
---
# Vault vérifie les jetons de ServiceAccount qu'on lui présente en les soumettant à l'API server
# (TokenReview, chapitre 42) : il lui faut ce droit.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cours-vault-tokenreview
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
- kind: ServiceAccount
  name: vault
  namespace: coffre
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault
  namespace: coffre
spec:
  replicas: 1
  selector:
    matchLabels: {app: vault}
  template:
    metadata:
      labels: {app: vault}
    spec:
      serviceAccountName: vault
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: vault
        image: hashicorp/vault:2.1.2
        command: [vault, server, -dev, -dev-listen-address=0.0.0.0:8200, -dev-root-token-id=jeton-racine-du-cours]
        env:
        - {name: HOME, value: /tmp}
        - {name: SKIP_SETCAP, value: "true"}
        ports:
        - containerPort: 8200
        readinessProbe:
          httpGet: {path: /v1/sys/health, port: 8200}
        resources:
          requests: {cpu: 20m, memory: 64Mi}
          limits: {memory: 192Mi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
        volumeMounts:
        - {name: tmp, mountPath: /tmp}
      volumes:
      - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: vault
  namespace: coffre
spec:
  selector: {app: vault}
  ports:
  - port: 8200
