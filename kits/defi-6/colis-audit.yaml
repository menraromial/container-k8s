# Défi VI : une copie de Colis, déployée vite, « pour tester ». À auditer, puis à corriger.
apiVersion: v1
kind: Namespace
metadata:
  name: colis-audit
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: colis-config
  namespace: colis-audit
data:
  COLIS_REDIS: redis://redis:6379/0
  COLIS_PURGE_JOURS: "30"
  COLIS_VERSION: "2.1.0"
  POSTGRES_PASSWORD: colis-audit-2026
---
# « pour que la CI puisse déployer »
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: equipe-et-robots
  namespace: colis-audit
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: Group
  name: system:serviceaccounts:colis-audit
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
---
# « le jeton de la CI, qui n'expire jamais, c'est plus pratique »
apiVersion: v1
kind: Secret
metadata:
  name: jeton-ci
  namespace: colis-audit
  annotations:
    kubernetes.io/service-account.name: default
type: kubernetes.io/service-account-token
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: colis-audit
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: postgres}
  template:
    metadata:
      labels: {app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: colis}
    spec:
      containers:
      - name: postgres
        image: postgres:18-alpine
        env:
        - {name: POSTGRES_USER, value: colis}
        - {name: POSTGRES_DB, value: colis}
        envFrom:
        - configMapRef: {name: colis-config}
        ports:
        - containerPort: 5432
        volumeMounts:
        - {name: donnees, mountPath: /var/lib/postgresql}
      volumes:
      - {name: donnees, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: colis-audit
spec:
  selector: {app.kubernetes.io/name: postgres}
  ports:
  - port: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: colis-audit
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: redis}
  template:
    metadata:
      labels: {app.kubernetes.io/name: redis, app.kubernetes.io/part-of: colis}
    spec:
      containers:
      - name: redis
        image: redis:8.8-alpine
        ports:
        - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: colis-audit
spec:
  selector: {app.kubernetes.io/name: redis}
  ports:
  - port: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: colis-audit
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: api}
  template:
    metadata:
      labels: {app.kubernetes.io/name: api, app.kubernetes.io/part-of: colis}
    spec:
      containers:
      - name: api
        image: host.minikube.internal:5001/colis/api:2.1
        envFrom:
        - configMapRef: {name: colis-config}
        env:
        - {name: COLIS_DB, value: "postgresql://colis:$(POSTGRES_PASSWORD)@postgres:5432/colis"}
        ports:
        - {name: http, containerPort: 8000}
        readinessProbe:
          httpGet: {path: /pret, port: http}
        resources:
          requests: {cpu: 20m, memory: 64Mi}
          limits: {memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: colis-audit
spec:
  selector: {app.kubernetes.io/name: api}
  ports:
  - port: 8000
    targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: colis-audit
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: web}
  template:
    metadata:
      labels: {app.kubernetes.io/name: web, app.kubernetes.io/part-of: colis}
    spec:
      containers:
      - name: web
        image: host.minikube.internal:5001/colis/web:1.0
        ports:
        - {name: http, containerPort: 80}
        resources:
          requests: {cpu: 10m, memory: 16Mi}
          limits: {memory: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: colis-audit
spec:
  selector: {app.kubernetes.io/name: web}
  ports:
  - port: 80
    targetPort: http
