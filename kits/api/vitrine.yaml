# La vitrine, appliquée côté serveur par le gestionnaire « equipe-web ».
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vitrine
spec:
  replicas: 2
  selector:
    matchLabels: {app: vitrine}
  template:
    metadata:
      labels: {app: vitrine}
    spec:
      containers:
      - name: web
        image: registry.k8s.io/e2e-test-images/agnhost:2.61
        args: [netexec, --http-port=8080]
        resources:
          requests: {cpu: 10m, memory: 16Mi}
