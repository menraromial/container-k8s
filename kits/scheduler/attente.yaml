# Trois Pods que le scheduler ne peut pas placer tout de suite, chacun pour une raison différente.
apiVersion: v1
kind: Pod
metadata:
  name: exigeant           # veut un nœud étiqueté disque=ssd, qui n'existe pas encore
spec:
  nodeSelector: {disque: ssd}
  containers:
  - {name: c, image: registry.k8s.io/e2e-test-images/agnhost:2.61, args: [pause]}
---
apiVersion: v1
kind: Pod
metadata:
  name: glouton            # demande plus de processeur qu'aucun nœud n'en a
spec:
  containers:
  - name: c
    image: registry.k8s.io/e2e-test-images/agnhost:2.61
    args: [pause]
    resources:
      requests: {cpu: "50"}
---
apiVersion: v1
kind: Pod
metadata:
  name: retenu             # porte d'ordonnancement : le scheduler ne le regarde pas tant qu'elle est là
spec:
  schedulingGates:
  - name: cours.exemple/validation
  containers:
  - {name: c, image: registry.k8s.io/e2e-test-images/agnhost:2.61, args: [pause]}
