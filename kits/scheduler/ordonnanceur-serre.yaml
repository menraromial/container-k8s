# Un second scheduler, « ordonnanceur-serre », qui tasse les Pods sur les nœuds déjà occupés
# (stratégie MostAllocated) et journalise ses calculs (-v=10). Namespace ch37.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ordonnanceur-serre
  namespace: ch37
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cours-ordonnanceur-serre
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: system:kube-scheduler}
subjects:
- {kind: ServiceAccount, name: ordonnanceur-serre, namespace: ch37}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cours-ordonnanceur-serre-volumes
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: system:volume-scheduler}
subjects:
- {kind: ServiceAccount, name: ordonnanceur-serre, namespace: ch37}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cours-ordonnanceur-serre
  namespace: kube-system
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: extension-apiserver-authentication-reader}
subjects:
- {kind: ServiceAccount, name: ordonnanceur-serre, namespace: ch37}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ordonnanceur-serre
  namespace: ch37
data:
  config.yaml: |
    apiVersion: kubescheduler.config.k8s.io/v1
    kind: KubeSchedulerConfiguration
    leaderElection:
      leaderElect: false
    profiles:
    - schedulerName: ordonnanceur-serre
      pluginConfig:
      - name: NodeResourcesFit
        args:
          scoringStrategy:
            type: MostAllocated
            resources:
            - {name: cpu, weight: 1}
            - {name: memory, weight: 1}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ordonnanceur-serre
  namespace: ch37
spec:
  replicas: 1
  selector:
    matchLabels: {app: ordonnanceur-serre}
  template:
    metadata:
      labels: {app: ordonnanceur-serre}
    spec:
      serviceAccountName: ordonnanceur-serre
      containers:
      - name: kube-scheduler
        image: registry.k8s.io/kube-scheduler:v1.37.0
        command: [kube-scheduler, --config=/etc/ordonnanceur/config.yaml, -v=10]
        resources:
          requests: {cpu: 50m, memory: 64Mi}
        volumeMounts:
        - {name: config, mountPath: /etc/ordonnanceur}
      volumes:
      - name: config
        configMap: {name: ordonnanceur-serre}
