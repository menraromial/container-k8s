apiVersion: v1
kind: Namespace
metadata:
  name: verif-images
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.37
---
# Un certificat auto-signé suffit : cert-manager injectera ce certificat dans la configuration
# du webhook, pour que l'API server lui fasse confiance.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: auto-signe
  namespace: verif-images
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: verif-images
  namespace: verif-images
spec:
  secretName: verif-images-tls
  dnsNames: [verif-images.verif-images.svc]
  issuerRef:
    name: auto-signe
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: verif-images
  namespace: verif-images
spec:
  replicas: 1
  selector:
    matchLabels: {app: verif-images}
  template:
    metadata:
      labels: {app: verif-images}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: webhook
        image: python:3.14-alpine
        command: [python, -u, /app/webhook.py]
        ports:
        - containerPort: 8443
        readinessProbe:
          tcpSocket: {port: 8443}
        resources:
          requests: {cpu: 10m, memory: 32Mi}
          limits: {memory: 64Mi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
        volumeMounts:
        - {name: code, mountPath: /app}
        - {name: certs, mountPath: /certs}
      volumes:
      - name: code
        configMap: {name: verif-images-code}
      - name: certs
        secret: {secretName: verif-images-tls}
---
apiVersion: v1
kind: Service
metadata:
  name: verif-images
  namespace: verif-images
spec:
  selector: {app: verif-images}
  ports:
  - port: 443
    targetPort: 8443
