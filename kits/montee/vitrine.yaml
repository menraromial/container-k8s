# Une application témoin pour la montée de version : trois répliques, un budget de perturbation,
# un Service NodePort que la sonde interroge pendant toute l'opération.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vitrine
spec:
  replicas: 3
  selector:
    matchLabels:
      app: vitrine
  template:
    metadata:
      labels:
        app: vitrine
    spec:
      containers:
      - name: nginx
        image: nginx:1.30-alpine
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /
            port: 80
          periodSeconds: 2
        resources:
          requests: {cpu: 10m, memory: 16Mi}
          limits: {memory: 64Mi}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: vitrine
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: vitrine
---
apiVersion: v1
kind: Service
metadata:
  name: vitrine
spec:
  type: NodePort
  selector:
    app: vitrine
  ports:
  - port: 80
    nodePort: 30080
