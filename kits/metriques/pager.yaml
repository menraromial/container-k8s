# Un récepteur d'alertes minimal : il affiche dans son journal ce qu'Alertmanager lui envoie.
# Dans la vraie vie, ce serait PagerDuty, Opsgenie, un canal de discussion ou un courriel.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pager
  namespace: supervision
data:
  pager.py: |
    import json
    from http.server import BaseHTTPRequestHandler, HTTPServer

    class Recepteur(BaseHTTPRequestHandler):
        def do_POST(self):
            corps = json.loads(self.rfile.read(int(self.headers["Content-Length"])))
            for a in corps["alerts"]:
                print(f'{a["status"].upper():8} {a["labels"]["alertname"]:20} '
                      f'{a["labels"].get("severite", "-"):6} {a["annotations"].get("description", "")}',
                      flush=True)
            self.send_response(200)
            self.end_headers()

        def log_message(self, *args):
            pass

    HTTPServer(("", 8080), Recepteur).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pager
  namespace: supervision
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pager
    spec:
      containers:
      - name: pager
        image: host.minikube.internal:5001/colis/api:2.2    # une image Python déjà présente sur le nœud
        command: ["python", "/pager/pager.py"]
        ports:
        - containerPort: 8080
        resources:
          requests: {memory: 16Mi}
          limits: {memory: 64Mi}
        volumeMounts:
        - name: code
          mountPath: /pager
      volumes:
      - name: code
        configMap:
          name: pager
---
apiVersion: v1
kind: Service
metadata:
  name: pager
  namespace: supervision
spec:
  selector:
    app.kubernetes.io/name: pager
  ports:
  - port: 8080
