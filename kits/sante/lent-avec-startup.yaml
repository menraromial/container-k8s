apiVersion: v1
kind: Pod
metadata:
  name: lent-avec-startup
spec:
  containers:
  - name: app
    image: busybox:1.37
    command: ["sh", "-c", "echo 'chargement...'; sleep 30; touch /tmp/vivant; echo 'prêt'; sleep 3600"]
    startupProbe:
      exec:
        command: ["cat", "/tmp/vivant"]
      periodSeconds: 5
      failureThreshold: 12
    livenessProbe:
      exec:
        command: ["cat", "/tmp/vivant"]
      periodSeconds: 5
      failureThreshold: 3
