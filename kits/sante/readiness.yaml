apiVersion: apps/v1
kind: Deployment
metadata:
  name: pret
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pret
  template:
    metadata:
      labels:
        app: pret
    spec:
      containers:
      - name: web
        image: registry.k8s.io/e2e-test-images/agnhost:2.61
        args: ["netexec", "--http-port=8080"]
        readinessProbe:
          exec:
            command: ["cat", "/tmp/pret"]
          periodSeconds: 2
          failureThreshold: 1
        lifecycle:
          postStart:
            exec:
              command: ["sh", "-c", "touch /tmp/pret"]
---
apiVersion: v1
kind: Service
metadata:
  name: pret
spec:
  selector:
    app: pret
  ports:
  - port: 80
    targetPort: 8080
